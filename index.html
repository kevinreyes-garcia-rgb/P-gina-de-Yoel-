<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* PÁGINA 1 - PORTADA */
        #portada {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .portada-container {
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        .portada-imagen {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(226, 29, 40, 0.3);
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .portada-imagen:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(226, 29, 40, 0.5);
        }

        .btn-ver-juego {
            display: inline-block;
            padding: 20px 60px;
            background: linear-gradient(45deg, #E21D28, #FF6B6B);
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(226, 29, 40, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid transparent;
        }

        .btn-ver-juego:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(226, 29, 40, 0.6);
            background: linear-gradient(45deg, #FF6B6B, #E21D28);
            border-color: rgba(255,255,255,0.3);
        }

        /* PÁGINA 2 - EXPERIENCIA */
        #experiencia {
            min-height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            position: relative;
        }

        #experiencia::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(226, 29, 40, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 168, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .experiencia-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .game-logo-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(226, 29, 40, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(226, 29, 40, 0.5);
        }

        .game-subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .btn-entrar {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(45deg, #00C853, #00E676);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-entrar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 200, 83, 0.6);
        }

        .creador-section {
            margin-top: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .creador-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .creador-nombre {
            color: #00C853;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .creador-nombre:hover {
            color: #00E676;
            text-shadow: 0 0 20px rgba(0, 200, 83, 0.5);
        }

        .creador-nombre::before {
            content: '👤';
            font-size: 1.5rem;
        }

        .btn-volver {
            position: absolute;
            top: 30px;
            left: 30px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        /* PÁGINA 3 - PERFIL DEL CREADOR (YoelHosting) */
        #perfil-creador {
            min-height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
        }

        #perfil-creador::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(0, 200, 83, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(226, 29, 40, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .perfil-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        .perfil-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .perfil-header {
            margin-bottom: 30px;
        }

        .perfil-titulo {
            color: #00E676;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .perfil-titulo::before {
            content: '⭐';
            font-size: 2rem;
        }

        .perfil-subtitulo {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .perfil-foto-container {
            width: 180px;
            height: 180px;
            margin: 30px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(0, 230, 118, 0.5);
            box-shadow: 0 0 40px rgba(0, 230, 118, 0.3), 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .perfil-foto-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0, 230, 118, 0.5), 0 15px 40px rgba(0,0,0,0.4);
        }

        .perfil-foto {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .perfil-username {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .perfil-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
            border-color: rgba(0, 230, 118, 0.2);
        }

        .info-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-valor {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .info-valor.edad {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .info-valor.colaborador {
            color: #00E676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .btn-ver-roblox {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(45deg, #E21D28, #FF6B6B);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(226, 29, 40, 0.4);
            transition: all 0.3s ease;
        }

        .btn-ver-roblox:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(226, 29, 40, 0.6);
        }

        /* ANIMACIONES */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* EFECTOS DE PARTÍCULAS */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .portada-imagen {
                max-width: 90%;
            }

            .btn-ver-juego {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .game-card, .perfil-card {
                padding: 30px 20px;
            }

            .game-title, .perfil-titulo {
                font-size: 1.8rem;
            }

            .game-logo-container {
                width: 150px;
                height: 150px;
            }

            .perfil-foto-container {
                width: 140px;
                height: 140px;
            }

            .info-item {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- EFECTO DE PARTÍCULAS -->
    <div class="particles" id="particles"></div>

    <!-- PÁGINA 1: PORTADA -->
    <section id="portada">
        <div class="portada-container">
            <img src="images/portada.png" alt="Portada del Juego" class="portada-imagen" onerror="this.src='https://via.placeholder.com/600x400/E21D28/FFFFFF?text=Tu+Portada+Aquí'">
            <br>
            <a href="#" class="btn-ver-juego" onclick="mostrarExperiencia(); return false;">
                🎮 Ver Juego
            </a>
        </div>
    </section>

    <!-- PÁGINA 2: EXPERIENCIA -->
    <section id="experiencia">
        <a href="#" class="btn-volver" onclick="mostrarPortada(); return false;">
            ← Volver
        </a>

        <div class="experiencia-container">
            <div class="game-card">
                <div class="game-logo-container">
                    <img src="images/video/logogame.gif" alt="Logo del Juego" class="game-logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:80px\'>🎮</div>';">
                </div>
                <h1 class="game-title">¡Únete a la Aventura!</h1>
                <p class="game-subtitle">Experiencia exclusiva en Roblox</p>

                <a href="https://ro.blox.com/Ebh5?af_dp=roblox%3A%2F%2Fnavigation%2Fgame_details%3FgameId%3D6860794805&af_web_dp=https%3A%2F%2Fwww.roblox.com%2Fgames%2F114468312619205" 
                   target="_blank" 
                   class="btn-entrar">
                    🚀 Entrar a la Experiencia
                </a>
            </div>

            <div class="creador-section">
                <div class="creador-label">Creado por</div>
                <span class="creador-nombre" onclick="mostrarPerfil();" style="cursor: pointer;">
                    yoel48ja02
                </span>
            </div>
        </div>
    </section>

    <!-- PÁGINA 3: PERFIL DEL CREADOR (YoelHosting) -->
    <section id="perfil-creador">
        <a href="#" class="btn-volver" onclick="mostrarExperiencia(); return false;">
            ← Volver
        </a>

        <div class="perfil-container">
            <div class="perfil-card">
                <div class="perfil-header">
                    <h1 class="perfil-titulo">YoelHosting</h1>
                    <p class="perfil-subtitulo">Perfil del Creador</p>
                </div>

                <div class="perfil-foto-container">
                    <img src="images/perfil.png" alt="Foto de perfil" class="perfil-foto" onerror="this.src='https://via.placeholder.com/180x180/333/FFFFFF?text=Sin+Foto'">
                </div>

                <h2 class="perfil-username">yoel48ja02</h2>

                <div class="perfil-info">
                    <div class="info-item">
                        <span class="info-label">📅 Edad</span>
                        <span class="info-valor edad">13 años</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">🤝 Colaborador</span>
                        <span class="info-valor colaborador">Yumina889</span>
                    </div>
                </div>

                <a href="https://www.roblox.com/users/yoel48ja02/profile" 
                   target="_blank" 
                   class="btn-ver-roblox">
                    🔗 Ver en Roblox
                </a>
            </div>
        </div>
    </section>

    <script>
        // Generar partículas
        function crearParticulas() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        // Navegación entre páginas
        function mostrarExperiencia() {
            document.getElementById('portada').style.display = 'none';
            document.getElementById('perfil-creador').style.display = 'none';
            document.getElementById('experiencia').style.display = 'flex';
            document.body.style.overflow = 'auto';
        }

        function mostrarPortada() {
            document.getElementById('experiencia').style.display = 'none';
            document.getElementById('perfil-creador').style.display = 'none';
            document.getElementById('portada').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function mostrarPerfil() {
            document.getElementById('portada').style.display = 'none';
            document.getElementById('experiencia').style.display = 'none';
            document.getElementById('perfil-creador').style.display = 'flex';
            document.body.style.overflow = 'auto';
        }

        // Inicializar
        window.onload = function() {
            crearParticulas();
        };

        // Prevenir scroll en portada
        document.body.style.overflow = 'hidden';
    </script>
</body>
</html>
